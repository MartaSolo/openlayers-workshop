<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenLayers workshop</title>
    <style>
      :root {
        color: #f7f7ff;
        background: #04041b;
        font-family: sans-serif;
      }

      body {
        margin: 0;
      }

      main {
        box-sizing: border-box;
        width: min(52rem, 100%);
        margin: 0 auto;
        padding: 4rem 1.5rem;
      }

      h1 {
        margin-top: 0;
      }

      ul {
        padding: 0;
        list-style: none;
      }

      li {
        padding-bottom: 1rem;
      }

      a {
        display: block;
        padding: 1rem 1.25rem;
        color: #04041b;
        background: #b6f0dc;
        border-radius: 0.5rem;
        font-weight: 700;
        text-decoration: none;
      }

      a:hover,
      a:focus-visible {
        background: #d5faed;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>OpenLayers workshop</h1>
      <ul>
        <li><a href="./exercises/vector-data/">Vector data</a></li>
        <li><a href="./exercises/mobile/">Mobile Maps and Sensors</a></li>
        <li><a href="./exercises/geotiff/">GeoTIFF Rendering</a></li>
      </ul>
    </main>
  </body>
</html>
